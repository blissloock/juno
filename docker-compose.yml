services:
  # 1. Base de datos de series temporales (TimescaleDB)
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: juno_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - juno_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend API en Rust (Sonda y Servidor)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: juno_backend
    restart: always
    platform: linux/amd64
    ports:
      - "8080:8080"
      - "2055:2055/udp"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - RUST_LOG=info
      - PORT=8080
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_PASS=${GMAIL_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - juno_network

  # 3. Frontend (Nginx) + Cloudflare Tunnel, empaquetados en el mismo
  #    contenedor (ver frontend/Dockerfile y frontend/entrypoint.sh) --
  #    así todo lo que da la cara al público viaja como una sola imagen,
  #    portable a cualquier equipo sin depender de un segundo contenedor.
  #    El HTML/CSS/JS ya quedan horneados dentro de la imagen (ver
  #    Dockerfile), así que ya NO se monta ./frontend como volumen.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: juno_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      # Config y credenciales del túnel SÍ se montan desde el host (no se
      # hornean en la imagen): así la misma imagen sirve para cualquier
      # dominio/túnel sin tener que reconstruirla, y las credenciales
      # nunca terminan versionadas en la imagen ni en git (ver
      # .gitignore: cloudflared/creds.json).
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/creds.json:/etc/cloudflared/creds.json:ro
    networks:
      - juno_network

volumes:
  db_data:

networks:
  juno_network:
    driver: bridge
